<!DOCTYPE html>
<html>
<head>
    <title>Age Checker</title>
</head>
<body>

    <form>
        <label>Full Name:</label>
        <input type="text" id="userName" placeholder="e.g., Lyka Mancilla">

        <br><br>

        <label>Year &amp; Section:</label>
        <select id="yearSection">
            <option value="">-- Select --</option>
            <option value="2IT1">2IT1</option>
            <option value="2IT2">2IT2</option>
            <option value="2IT3">2IT3</option>
            <option value="2IT4">2IT4</option>
            <option value="2IT5">2IT5</option>
        </select>

        <br><br>

        <label>Age:</label>
        <input type="number" id="userAge" placeholder="e.g., 25">

        <br><br>
        <button type="button" onclick="checkAge()">Submit</button>

        <p id="outputResult"></p>
    </form>

    <script>
        function checkAge() {
            const nameInput = document.getElementById("userName");
            const yearSectionInput = document.getElementById("yearSection");
            const ageInput = document.getElementById("userAge");
            const outputText = document.getElementById("outputResult");
            const name = nameInput.value.trim();
            const yearSection = yearSectionInput.value;
            const ageValue = Number(ageInput.value);

            let missingFields = [];

            if (name === "") {
                missingFields.push("Full Name");
            }
            if (yearSection === "") {
                missingFields.push("Year & Section");
            }
            if (ageInput.value.trim() === "" || isNaN(ageValue)) {
                missingFields.push("Age");
            }
            if (missingFields.length > 0) {
                outputText.style.color = "red";
                outputText.textContent =
                    "Please complete all fields, including " + missingFields.join(" and ") + ".";
                return;
            }
            if (ageValue <= 0) {
                outputText.style.color = "red";
                outputText.textContent = "Please input a number greater than 1.";
            } else if (ageValue >= 18) {
                outputText.style.color = "green";
                outputText.textContent =
                    name + ", Access Granted: Adult Account. You are " + ageValue + ". Section: " + yearSection + ".";
            } else {
                outputText.style.color = "red";
                outputText.textContent =
                    name + ", Access Restricted: Minor Account. You are " + ageValue + ". Section: " + yearSection + ".";
            }
        }
    </script>

</body>
</html>
